name: SYNERGY Windows Build V0.9
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AUTOPILOT_EXTERNAL_EFFECTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Import original GitHub projects
        run: python import_original_sources.py
      - name: Verify original imports
        run: |
          python sync_smm_native.py
          python verify_imports.py
          python tests/verify_native_release.py
      - name: Python integration and HTTP tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - name: Frontend dependencies
        working-directory: desktop
        run: npm install
      - name: Build original SMM backed frontend
        working-directory: desktop
        run: npm run build
      - name: Tauri Windows NSIS build
        working-directory: desktop
        run: npm run tauri build
      - name: Assert actual installer exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe -ErrorAction SilentlyContinue)
          if ($files.Count -lt 1) { throw 'Missing Windows NSIS installer' }
          $files | Select-Object FullName,Length | Format-Table
      - uses: actions/upload-artifact@v4
        with:
          name: SYNERGY-AI-WORKSPACE-V09-NSIS
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
