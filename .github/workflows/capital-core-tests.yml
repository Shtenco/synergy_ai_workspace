name: SYNERGY Local Capital Core CI
on:
  push:
    branches: [release/v1.0-desktop-rc]
    paths:
      - 'workspace/capital_engine.py'
      - 'workspace/meta_orchestrator.py'
      - 'workspace/service.py'
      - 'tests/test_capital_engine.py'
      - 'tests/test_meta_orchestrator.py'
      - '.github/workflows/capital-core-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capital-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q workspace/capital_engine.py workspace/meta_orchestrator.py workspace/service.py tests/test_capital_engine.py tests/test_meta_orchestrator.py
      - name: Local ledger and policy tests (no network)
        run: python -m unittest -v tests.test_capital_engine tests.test_meta_orchestrator
